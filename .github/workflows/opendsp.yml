name: OpenDSP Teak compiler
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld ninja-build cmake python3 g++
      - name: Build the compiler from this commit
        id: compiler
        run: sh opendsp/build.sh
      - name: Predicate assembly regression
        run: build/bin/llc -mtriple=teak -O2 -asm-verbose=false llvm/test/CodeGen/Teak/predicate-flags.ll -o - | build/bin/FileCheck llvm/test/CodeGen/Teak/predicate-flags.ll
      - name: Large pointer offsets
        run: build/bin/llc -mtriple=teak -O2 llvm/test/CodeGen/Teak/large-gep.ll -o - | build/bin/FileCheck llvm/test/CodeGen/Teak/large-gep.ll
      - uses: actions/checkout@v4
        with:
          repository: wwylele/teakra
          ref: 3d697a18df504f4677b65129d9ab14c7c597e3eb
          path: inputs/teakra
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: xiph/opus
          ref: 22244de5a79bd1d6d623c32e72bf1954b56235be
          path: inputs/opus
      - uses: actions/checkout@v4
        with:
          repository: xiph/ogg
          ref: e1774cd77f471443541596e09078e78fdc342e4f
          path: inputs/libogg
      - name: Get the pinned Vorbis decoder
        run: |
          git init inputs/tremor
          git -C inputs/tremor remote add origin https://gitlab.xiph.org/xiph/tremor.git
          git -C inputs/tremor fetch --depth 1 origin 820fb3237ea81af44c9cc468c8b4e20128e3e5ad
          git -C inputs/tremor checkout --detach FETCH_HEAD
      - name: Build the pinned DSP emulator
        run: |
          cmake -S inputs/teakra -B inputs/teakra/b -G Ninja -DCMAKE_BUILD_TYPE=Release -DTEAKRA_BUILD_UNIT_TESTS=OFF -DTEAKRA_BUILD_TOOLS=OFF -DTEAKRA_WARNINGS_AS_ERRORS=OFF
          cmake --build inputs/teakra/b --target teakra --parallel 2
      - name: Execute compiled code against references
        env:
          TEAKRA: ${{ github.workspace }}/inputs/teakra
          OPUS_SOURCE: ${{ github.workspace }}/inputs/opus
          TEAK_CC: ${{ github.workspace }}/build/bin/clang
          TEAK_LD: ${{ github.workspace }}/build/bin/ld.lld
        run: |
          python3 opendsp/tests/run.py --case simple --label ci
          python3 opendsp/tests/run.py --case comparisons --label ci
          python3 opendsp/tests/run.py --case sort --label ci
          python3 opendsp/tests/run.py --case nlsf --label ci
          python3 opendsp/tests/run.py --case clz --label ci
          python3 opendsp/tests/run.py --case multiply --label ci
          python3 opendsp/tests/run.py --case word_product --label ci
          python3 opendsp/tests/run.py --case high_product --label ci
          python3 opendsp/tests/run.py --case silk_math --label ci
          python3 opendsp/tests/run.py --case stack --label ci
          python3 opendsp/tests/run.py --case bulk --label ci
          python3 opendsp/tests/run.py --case calls --label ci
          python3 opendsp/tests/run.py --case callback --label ci
          python3 opendsp/tests/run.py --case callback --opt=-O1 --label ci
          python3 opendsp/tests/run.py --case interpolate --label ci
          python3 opendsp/tests/run.py --case word_memory --label ci
          python3 opendsp/tests/run.py --case byte_memory --label ci
          python3 opendsp/tests/run.py --case division --max-steps 50000000 --label ci
          python3 opendsp/tests/run.py --case range_decoder --max-steps 50000000 --label ci
          python3 opendsp/tests/run.py --case byte_order --label ci
          python3 opendsp/tests/run.py --case dynamic_stack --label ci
          python3 opendsp/tests/run.py --case dynamic_stack --opt=-O1 --label ci
          python3 opendsp/tests/run.py --case size_types --label ci
          python3 opendsp/tests/run.py --case granules --label ci
          python3 opendsp/tests/run.py --case granules --opt=-O1 --label ci
          python3 opendsp/tests/run.py --case varargs --label ci
          python3 opendsp/tests/run.py --case varargs --opt=-O1 --label ci
          python3 opendsp/tests/run.py --case table_words --label ci
          python3 opendsp/tests/run.py --case pointers --label ci
          python3 opendsp/tests/run.py --case fft_math --label ci
          for length in 60 120 240 480; do
            for vector in 0 1 2 3 4; do
              python3 opendsp/tests/run.py --case fft --fft-size "$length" --fft-vector "$vector" --label ci
            done
          done
          for length in 120 240 480 960; do
            for stride in 1 2 4 8; do
              if [ "$((length * stride))" -le 960 ]; then
                for vector in 0 1 2 3 4 5 6 7; do
                  python3 opendsp/tests/run.py --case mdct --mdct-size "$length" --mdct-stride "$stride" --mdct-vector "$vector" --label ci
                done
              fi
            done
            for vector in 0 2 5 6 7; do
              python3 opendsp/tests/run.py --case mdct --mdct-size "$length" --mdct-vector "$vector" --mdct-frames 1 --label ci
            done
          done
          for length in 64 128 256 512 1024 2048 4096 8192; do
            for vector in 0 1 2 3 4; do
              python3 opendsp/tests/run.py --case vorbis_mdct --vorbis-size "$length" --vorbis-vector "$vector" --max-steps 100000000 --label ci
            done
          done
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-regressions
          path: |
            opendsp/tests/build/*.json
            opendsp/tests/build/*log
            opendsp/tests/build/*.s
            opendsp/tests/build/*.pcm
      - name: Compiler binaries
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: teak-llvm-linux
          path: |
            build/bin/clang
            build/bin/ld.lld
            build/bin/llc
            build/bin/llvm-readelf
            build/lib/clang/11.0.0/include
            build/lib/teak/libteak_rt.a
